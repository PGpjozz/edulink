name: Sync database schema

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "sync" to apply Prisma schema changes to the configured database.
        required: true

jobs:
  db-push:
    if: ${{ inputs.confirm == 'sync' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply Prisma schema to production database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run db:sync
